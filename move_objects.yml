---
# Move PAN-OS objects between Panorama scopes (device group <-> device group,
# shared <-> device group). Reads files/objects.csv, copies each <entry> to the
# destination scope, then deletes it from the source. Panorama is only
# committed when commit_changes=true.
- name: Move PAN-OS objects between Panorama scopes
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    api_base: "https://{{ panorama_ip }}/api/"
    # The API key travels in a header, never in the URL (URLs end up in logs).
    api_headers:
      X-PAN-KEY: "{{ api_key }}"
    type_node_map:
      address: address
      address-group: address-group
      service: service
      service-group: service-group
    entry_regex: '<entry\b'

  tasks:
    - name: Read objects from CSV
      community.general.read_csv:
        path: "{{ objects_csv }}"
      register: objects_csv_data

    - name: Keep non-empty rows
      ansible.builtin.set_fact:
        objects_to_move: "{{ objects_csv_data.list | selectattr('object_name') | list }}"

    - name: Ensure the CSV has rows
      ansible.builtin.assert:
        that: objects_to_move | length > 0
        fail_msg: "No rows found in {{ objects_csv }}"
        success_msg: "Loaded {{ objects_to_move | length }} rows from {{ objects_csv }}"

    - name: Create logs directory
      ansible.builtin.file:
        path: logs
        state: directory
        mode: "0755"

    - name: Set log file path
      ansible.builtin.set_fact:
        log_file: "logs/moves_{{ now().strftime('%Y%m%d_%H%M%S') }}.csv"

    - name: Create log CSV with header
      ansible.builtin.copy:
        dest: "{{ log_file }}"
        content: "timestamp,object_name,object_type,src_scope,dst_scope,status,message\n"
        force: false
        mode: "0644"

    - name: Move each object
      ansible.builtin.include_tasks: tasks/move_one.yml
      loop: "{{ objects_to_move }}"
      loop_control:
        loop_var: obj
        label: "{{ obj.object_name }} ({{ obj.object_type }}) {{ obj.src_scope }} -> {{ obj.dst_scope }}"

    - name: Commit on Panorama
      when: commit_changes | bool and not dry_run | bool
      ansible.builtin.uri:
        url: "{{ api_base }}"
        method: POST
        headers: "{{ api_headers }}"
        body_format: form-urlencoded
        body:
          type: commit
          cmd: "<commit></commit>"
        validate_certs: "{{ panorama_validate_certs }}"
        return_content: true
      register: commit_result
      failed_when: commit_result.status != 200 or 'status="success"' not in commit_result.content

    - name: Show commit job
      when: commit_result is defined and commit_result.content is defined
      ansible.builtin.debug:
        msg: "{{ commit_result.content | regex_search('<job>[0-9]+</job>') | default('commit queued') }}"
